<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST"
          action="{{ url_for('edit_student', student_id=student.id) }}">

        <label>Name:</label>

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            required
        >

        <br><br>


        <label>Roll Number:</label>

        <input
            type="text"
            name="roll_no"
            value="{{ student.roll_no }}"
            required
        >

        <br><br>


        <label>Email:</label>

        <input
            type="email"
            name="email"
            value="{{ student.email }}"
        >

        <br><br>


        <label>Class:</label>

        <input
            type="text"
            name="class_name"
            value="{{ student.class_name }}"
        >

        <br><br>


        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="{{ url_for('students') }}">
        Back to Students
    </a>

</body>

</html>
