<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Add Student</h1>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <p class="message">
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST"
              action="{{ url_for('add_student') }}">

            <label>Name:</label>

            <input
                type="text"
                name="name"
                required
            >

            <br><br>

            <label>Roll Number:</label>

            <input
                type="text"
                name="roll_no"
                required
            >

            <br><br>

            <label>Email:</label>

            <input
                type="email"
                name="email"
            >

            <br><br>

            <label>Class:</label>

            <input
                type="text"
                name="class_name"
            >

            <br><br>

            <button type="submit">
                Add Student
            </button>

        </form>

        <br>

        <a href="{{ url_for('students') }}">
            View Students
        </a>

        <br><br>

        <a href="{{ url_for('home') }}">
            Go Home
        </a>

    </div>

</body>

</html>
