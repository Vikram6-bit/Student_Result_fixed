<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 500px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #29459b;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #263b63;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: 2px solid #d2d9e8;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        input:focus {
            outline: none;
            border-color: #3564df;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #3564df;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #294fc4;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #3564df;
            text-decoration: none;
            font-size: 16px;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Roll Number</label>

        <input
            type="text"
            name="roll_no"
            placeholder="Enter your roll number"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="{{ url_for('admin_login') }}" class="back">
        Admin Login
    </a>

</div>

</body>
</html>
